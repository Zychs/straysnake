plugins {
    id 'com.android.application'
}

def webOut = layout.buildDirectory.dir('generated/web')

android {
    namespace 'com.zychs.snakeman'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zychs.snakeman'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += webOut.get().asFile
        }
    }
}

// The game is the repo's snake-man.html plus its modules in snake-man/: copy them in at build
// time (the page as the app's index), so there is only ever one copy of the game in the repo.
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../snake-man.html')) {
        rename { 'index.html' }
    }
    from(rootProject.file('../snake-man')) {
        include '*.js'
        into 'snake-man'
    }
    into webOut
}
tasks.named('preBuild') { dependsOn copyWeb }
